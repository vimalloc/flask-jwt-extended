# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py310,py311,py312,py313,py314,pypy3.11,mypy,coverage,style,docs

[testenv]
commands =
  pytest tests/
deps =
  pytest
  python-dateutil
  -rrequirements.txt
skip_install = true

[testenv:mypy]
commands =
  mypy flask_jwt_extended/ tests/
deps =
  pytest
  python-dateutil
  types-python-dateutil
  mypy
  -rrequirements.txt
skip_install = true

[testenv:coverage]
commands =
  coverage run --source flask_jwt_extended -m pytest -qq tests/
  coverage report --fail-under=100 --show-missing
deps =
  coverage
  pytest
  python-dateutil
  -rrequirements.txt
skip_install = true

[testenv:style]
deps = pre-commit
skip_install = true
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:docs]
# This gets color output working when run through tox
passenv=TERM
deps = -rdocs/requirements.txt
changedir = docs
allowlist_externals = make
commands =
  make dummy
  make linkcheck
