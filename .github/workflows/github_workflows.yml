name: GitHub Workflows

on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download and verify actionlint
        # curl --fail makes an HTTP/network error a hard failure instead of silently
        # producing a truncated file; --retry survives transient network blips.
        # Verifying the published checksum also catches a corrupted-but-complete download.
        # No --retry-delay, so curl backs off exponentially rather than spending every
        # attempt within a few seconds.
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"

          curl --fail --silent --show-error --location --retry 5 --retry-connrefused --retry-max-time 300 --max-time 60 \
            -o "$asset" "${base_url}/${asset}"
          curl --fail --silent --show-error --location --retry 5 --retry-connrefused --retry-max-time 300 --max-time 30 \
            -o checksums.txt "${base_url}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"

          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" actionlint

      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run zizmor
        env:
          ZIZMOR_VERSION: 1.30.1
        run: uvx --from "zizmor==${ZIZMOR_VERSION}" zizmor --persona=auditor --collect=workflows .
